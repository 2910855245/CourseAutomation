[package]
name = "rust_worker"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "cookies", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
dashmap = "6"
anyhow = "1"
base64 = "0.22"
axum = "0.8"
md5 = "0.7"
scraper = "0.20"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"