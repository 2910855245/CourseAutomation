[package]
name = "rust_worker"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "cookies", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
dashmap = "6"
anyhow = "1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
md5 = "0.7"
scraper = "0.20"
# ── 后端 API 骨架（纯 Rust 化阶段 0）──
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
regex = "1.13.1"
bcrypt = "0.15"
jsonwebtoken = "9"
sha2 = "0.11.0"
# 凭据加密（AES-256-GCM）：orders 表不再落明文密码
aes-gcm = "0.10"
futures-util = "0.3.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ddddocr-core = "0.2.4"
libloading = "0.8"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "alternative-backend", "api-17"] }
ndarray = "0.17"

[profile.release]
# 编译速度优先（I/O 密集项目，运行时对 opt 级别不敏感）
# 之前 lto="fat" + codegen-units=1 是编译慢的主因：全程序单线程链接优化。
lto = false
codegen-units = 16
strip = true
opt-level = 1
panic = "unwind"
