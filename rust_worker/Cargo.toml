[package]
name = "rust_worker"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync", "fs", "io-util"] }
# 0.13 起 application/x-www-form-urlencoded 也要显式开 form feature
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "cookies", "json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
dashmap = "6"
anyhow = "1"
base64 = "0.23"
# 二维码 PNG 生成（收银台二维码必须由后端出图，前端只渲染 qr_image）
qrcode = { version = "0.14", default-features = false, features = ["image"] }
# 二维码解码（管理端上传收款码/赞赏码图片自动识别内容）：纯 Rust，无 zbar 系统库依赖
rqrr = "0.11"
axum = { version = "0.8", features = ["ws", "multipart"] }
md5 = "0.8"
scraper = "0.27"
# ── 后端 API 骨架（纯 Rust 化阶段 0）──
rusqlite = { version = "0.40", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "compression-gzip", "compression-br", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
regex = "1.13.1"
# 学习通登录要用 AES-128-CBC 加密手机号/密码（版本与 aes-gcm 的传递依赖一致，不新增下载）
aes = "0.9"
# 首页链接解析（相对链接 join）；版本已在 Cargo.lock 中（reqwest/scraper 的传递依赖）
url = "2"
bcrypt = "0.19"
# 11.x 起必须显式选择 crypto provider（default 只带 use_pem）：
# 选纯 Rust 的 rust_crypto，避免引入 aws-lc-rs 的 C 工具链依赖
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
sha2 = "0.11.0"
# 凭据加密（AES-256-GCM）：orders 表不再落明文密码
aes-gcm = "0.11"
futures-util = "0.3.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ddddocr-core = "0.2.4"
libloading = "0.9"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "alternative-backend", "api-17"] }
ndarray = "0.17"

[profile.release]
# 编译速度优先（I/O 密集项目，运行时对 opt 级别不敏感）
# 之前 lto="fat" + codegen-units=1 是编译慢的主因：全程序单线程链接优化。
lto = false
codegen-units = 16
strip = true
opt-level = 1
panic = "unwind"
