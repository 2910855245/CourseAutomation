# Windows 开发机的构建目录覆盖。
#
# 原因：本项目在中文路径（FUCK 文理网课）下，mingw 链接器会找不到 rlib，
# 所以把 target 固定到 ASCII 路径。**仅影响本地构建产物位置**。
#
# Linux 部署时用环境变量覆盖即可（环境变量优先于本文件）：
#   CARGO_TARGET_DIR=/opt/anti-course/target cargo build --release
# 产物：$CARGO_TARGET_DIR/release/rust_worker
[build]
target-dir = "D:/dev/rust-target"